name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-checks:
    name: portfolio-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check page structure, internal links and assets
        run: python3 scripts/check_portfolio.py

      - name: Test nested-page and cross-page link checks
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Check JavaScript syntax
        run: |
          node --check docs/assets/main.js
          node --check docs/assets/theme.js

  browser-checks:
    name: browser-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node for accessibility checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund

      - name: Check responsive layout and interaction scenarios
        env:
          PORTFOLIO_ARTIFACTS: ${{ runner.temp }}/portfolio-browser
        run: python -B -m unittest discover -s tests/browser -p 'test_*.py' -v

      - name: Save failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-chromium
          path: ${{ runner.temp }}/portfolio-browser
          if-no-files-found: ignore

  cross-browser-checks:
    name: cross-browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser and accessibility dependencies
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps ${{ matrix.browser }}
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund

      - name: Check the portfolio in ${{ matrix.browser }}
        env:
          PORTFOLIO_BROWSER: ${{ matrix.browser }}
          PORTFOLIO_ARTIFACTS: ${{ runner.temp }}/portfolio-browser
        run: python -B -m unittest discover -s tests/browser -p 'test_*.py' -v

      - name: Save failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.browser }}
          path: ${{ runner.temp }}/portfolio-browser
          if-no-files-found: ignore
